hostname LEAF-BORDER
boot nxos bootflash:nxos64-cs.10.4.2.F.bin
nv overlay evpn
feature bgp
hardware access-list tcam region racl 512
hardware access-list tcam region arp-ether 256 double-wide
feature interface-vlan
feature vn-segment-vlan-based
feature nv overlay
fabric forwarding anycast-gateway-mac 0000.5e00.0101
route-map NH-UNCHANGED permit 10
  set ip next-hop unchanged
route-map CONNECTED permit 10
  match tag 12345
interface loopback0
  ip address 10.0.1.10/32
interface Ethernet1/2
  description to NX-SPINE-01
  no switchport
  mtu 9216
  ip address 10.1.0.5/31
  no shutdown
interface Ethernet1/3
  description to NX-SPINE-02
  no switchport
  mtu 9216
  ip address 10.1.1.5/31
  no shutdown
interface Ethernet1/1
  description to LEAF-3 (Cumulus fabric)
  no switchport
  mtu 9216
  ip address 10.255.0.1/31
  no shutdown
vlan 10
  vn-segment 10010
vlan 30
  vn-segment 10030
vlan 3001
  vn-segment 50001
vrf context TENANT1
  vni 50001
  rd auto
  address-family ipv4 unicast
    route-target both 65000:50001
    route-target both 65000:50001 evpn
interface Vlan3001
  no shutdown
  mtu 9216
  vrf member TENANT1
  ip forward
interface Vlan10
  no shutdown
  vrf member TENANT1
  ip address 10.10.10.1/24 tag 12345
  fabric forwarding mode anycast-gateway
interface Vlan30
  no shutdown
  vrf member TENANT1
  ip address 10.30.30.1/24 tag 12345
  fabric forwarding mode anycast-gateway
interface Ethernet1/11
  switchport
  switchport mode access
  switchport access vlan 30
  spanning-tree port type edge
  no shutdown
interface nve1
  no shutdown
  host-reachability protocol bgp
  source-interface loopback0
  member vni 10010
    ingress-replication protocol bgp
    suppress-arp
  member vni 10030
    ingress-replication protocol bgp
    suppress-arp
  member vni 50001 associate-vrf
evpn
  vni 10010 l2
    rd auto
    route-target import 65000:10010
    route-target export 65000:10010
  vni 10030 l2
    rd auto
    route-target import 65000:10030
    route-target export 65000:10030
router bgp 65210
  router-id 10.0.1.10
  bestpath as-path multipath-relax
  address-family ipv4 unicast
    network 10.0.1.10/32
    maximum-paths 8
  address-family l2vpn evpn
    retain route-target all
  neighbor 10.1.0.4
    remote-as 65200
    address-family ipv4 unicast
    address-family l2vpn evpn
      send-community
      send-community extended
      route-map NH-UNCHANGED out
  neighbor 10.1.1.4
    remote-as 65200
    address-family ipv4 unicast
    address-family l2vpn evpn
      send-community
      send-community extended
      route-map NH-UNCHANGED out
  neighbor 10.255.0.0
    remote-as 65103
    address-family ipv4 unicast
    address-family l2vpn evpn
      send-community
      send-community extended
      route-map NH-UNCHANGED out
  vrf TENANT1
    address-family ipv4 unicast
      redistribute direct route-map CONNECTED
      maximum-paths 8
