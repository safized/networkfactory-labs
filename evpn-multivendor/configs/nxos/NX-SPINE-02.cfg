hostname NX-SPINE-02
boot nxos bootflash:nxos64-cs.10.4.2.F.bin
nv overlay evpn
feature bgp
route-map NH-UNCHANGED permit 10
  set ip next-hop unchanged
route-map CONNECTED permit 10
  match tag 12345
interface loopback0
  ip address 10.0.1.2/32
interface Ethernet1/1
  description to NX-LEAF-01
  no switchport
  mtu 9216
  ip address 10.1.1.0/31
  no shutdown
interface Ethernet1/2
  description to NX-LEAF-02
  no switchport
  mtu 9216
  ip address 10.1.1.2/31
  no shutdown
interface Ethernet1/3
  description to LEAF-BORDER
  no switchport
  mtu 9216
  ip address 10.1.1.4/31
  no shutdown
router bgp 65200
  router-id 10.0.1.2
  bestpath as-path multipath-relax
  address-family ipv4 unicast
    network 10.0.1.2/32
    maximum-paths 8
  address-family l2vpn evpn
    retain route-target all
  neighbor 10.1.1.1
    remote-as 65211
    address-family ipv4 unicast
    address-family l2vpn evpn
      send-community
      send-community extended
      route-map NH-UNCHANGED out
  neighbor 10.1.1.3
    remote-as 65212
    address-family ipv4 unicast
    address-family l2vpn evpn
      send-community
      send-community extended
      route-map NH-UNCHANGED out
  neighbor 10.1.1.5
    remote-as 65210
    address-family ipv4 unicast
    address-family l2vpn evpn
      send-community
      send-community extended
      route-map NH-UNCHANGED out
