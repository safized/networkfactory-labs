hostname spine1
log stdout informational
!
no ip nht resolve-via-default
!
interface lo
 ip address 10.255.0.1/32
exit
interface eth1
 ip address 10.0.1.1/31
exit
interface eth2
 ip address 10.0.1.2/31
exit
interface eth3
 ip address 10.0.1.4/31
exit
!
router bgp 65000
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp bestpath as-path multipath-relax
 neighbor 10.0.1.0 remote-as 65011
 neighbor 10.0.1.0 timers 3 9
 neighbor 10.0.1.0 advertisement-interval 0
 neighbor 10.0.1.3 remote-as 65021
 neighbor 10.0.1.3 timers 3 9
 neighbor 10.0.1.3 advertisement-interval 0
 neighbor 10.0.1.5 remote-as 65022
 neighbor 10.0.1.5 timers 3 9
 neighbor 10.0.1.5 advertisement-interval 0
 !
 address-family ipv4 unicast
  maximum-paths 8
  maximum-paths ibgp 8
  neighbor 10.0.1.0 activate
  neighbor 10.0.1.3 activate
  neighbor 10.0.1.5 activate
  network 10.255.0.1/32
 exit-address-family
exit
!
end
