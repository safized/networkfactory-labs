hostname border1
log stdout informational
!
no ip nht resolve-via-default
!
interface lo
 ip address 10.255.0.21/32
exit
interface eth1
 ip address 10.0.1.3/31
exit
interface eth2
 ip address 10.0.2.0/31
exit
!
router bgp 65021
 bgp router-id 10.255.0.21
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.0.1.2 remote-as 65000
 neighbor 10.0.1.2 timers 3 9
 neighbor 10.0.1.2 advertisement-interval 0
 neighbor 10.0.2.1 remote-as 65099
 neighbor 10.0.2.1 timers 3 9
 neighbor 10.0.2.1 advertisement-interval 0
 !
 address-family ipv4 unicast
  maximum-paths 8
  maximum-paths ibgp 8
  neighbor 10.0.1.2 activate
  neighbor 10.0.2.1 activate
  network 10.255.0.21/32
 exit-address-family
exit
!
end
