hostname border2
log stdout informational
!
no ip nht resolve-via-default
!
interface lo
 ip address 10.255.0.22/32
exit
interface eth1
 ip address 10.0.1.5/31
exit
interface eth2
 ip address 10.0.2.2/31
exit
!
router bgp 65022
 bgp router-id 10.255.0.22
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.0.1.4 remote-as 65000
 neighbor 10.0.1.4 timers 3 9
 neighbor 10.0.1.4 advertisement-interval 0
 neighbor 10.0.2.3 remote-as 65099
 neighbor 10.0.2.3 timers 3 9
 neighbor 10.0.2.3 advertisement-interval 0
 !
 address-family ipv4 unicast
  maximum-paths 8
  maximum-paths ibgp 8
  neighbor 10.0.1.4 activate
  neighbor 10.0.2.3 activate
  network 10.255.0.22/32
 exit-address-family
exit
!
end
