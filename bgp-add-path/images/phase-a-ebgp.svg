<svg width="700" height="408" font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 700 408" xmlns="http://www.w3.org/2000/svg"><defs><marker id="mpa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5b6b70" stroke-width="1.6"/></marker></defs><rect width="700" height="408" rx="10" fill="#ffffff"/><g font-size="12" text-anchor="middle"><rect x="270" y="20" width="160" height="44" rx="5" fill="#f3f5f4" stroke="#8aa09a" stroke-width="1.4"/><text x="350.0" y="40.0" fill="#1d2a2f">spine1</text><text x="350.0" y="55.0" font-size="10" fill="#5b6b70">AS 65000</text><rect x="40" y="150" width="140" height="44" rx="5" fill="#e7f1ed" stroke="#1f6a5a" stroke-width="1"/><text x="110.0" y="170.0" fill="#1d2a2f">leaf1</text><text x="110.0" y="185.0" font-size="10" fill="#5b6b70">AS 65011</text><rect x="40" y="250" width="140" height="40" rx="5" fill="#f8efe1" stroke="#b36a12" stroke-width="1"/><text x="110.0" y="268.0" fill="#1d2a2f">h1</text><text x="110.0" y="283.0" font-size="10" fill="#5b6b70">10.20.1.10</text><rect x="320" y="150" width="140" height="44" rx="5" fill="#e7f1ed" stroke="#1f6a5a" stroke-width="1"/><text x="390.0" y="170.0" fill="#1d2a2f">border1</text><text x="390.0" y="185.0" font-size="10" fill="#5b6b70">AS 65021</text><rect x="520" y="150" width="140" height="44" rx="5" fill="#e7f1ed" stroke="#1f6a5a" stroke-width="1"/><text x="590.0" y="170.0" fill="#1d2a2f">border2</text><text x="590.0" y="185.0" font-size="10" fill="#5b6b70">AS 65022</text><rect x="420" y="250" width="140" height="44" rx="5" fill="#f3f5f4" stroke="#8aa09a" stroke-width="1"/><text x="490.0" y="270.0" fill="#1d2a2f">dcgw</text><text x="490.0" y="285.0" font-size="10" fill="#5b6b70">AS 65099</text><rect x="420" y="330" width="140" height="40" rx="5" fill="#f8efe1" stroke="#b36a12" stroke-width="1"/><text x="490.0" y="348.0" fill="#1d2a2f">h2</text><text x="490.0" y="363.0" font-size="10" fill="#5b6b70">10.99.0.0/24</text><line x1="110" y1="150" x2="300" y2="64" stroke="#8aa09a" stroke-width="1"/><line x1="390" y1="150" x2="340" y2="64" stroke="#8aa09a" stroke-width="1"/><line x1="590" y1="150" x2="400" y2="64" stroke="#8aa09a" stroke-width="1"/><line x1="390" y1="194" x2="470" y2="250" stroke="#8aa09a" stroke-width="1"/><line x1="590" y1="194" x2="510" y2="250" stroke="#8aa09a" stroke-width="1"/><line x1="110" y1="194" x2="110" y2="250" stroke="#8aa09a" stroke-width="1"/><line x1="490" y1="294" x2="490" y2="330" stroke="#8aa09a" stroke-width="1"/><text x="560" y="84" font-size="10.5" fill="#1f6a5a" text-anchor="start">spine1 learns two paths:</text><text x="560" y="99" font-size="10" fill="#1d2a2f" text-anchor="start">65021 65099 via border1</text><text x="560" y="113" font-size="10" fill="#1d2a2f" text-anchor="start">65022 65099 via border2</text><text x="40" y="92" font-size="10.5" fill="#a83535" text-anchor="start">leaf1 receives next hop</text><text x="40" y="107" font-size="10.5" fill="#a83535" text-anchor="start">10.0.1.1 (spine1) for every</text><text x="40" y="122" font-size="10.5" fill="#a83535" text-anchor="start">path, with or without ADD-PATH</text><text x="350" y="395" font-size="10.5" fill="#1d2a2f" text-anchor="middle">eBGP rewrites the next hop at every hop, so the spine, not the leaf, decides how traffic is split.</text></g></svg>