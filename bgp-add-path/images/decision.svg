<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="358" font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 700 358" xmlns="http://www.w3.org/2000/svg"><defs><marker id="mdf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5b6b70" stroke-width="1.6"/></marker></defs><rect width="700" height="358" rx="10" fill="#ffffff"/><g font-size="12" text-anchor="middle"><rect x="20" y="20" width="300" height="48" rx="24" fill="#ffffff" stroke="#1d2a2f"/><text x="170.0" y="40" font-size="11" fill="#1d2a2f" text-anchor="middle">Does the router that chooses the path</text><text x="170.0" y="56" font-size="11" fill="#1d2a2f" text-anchor="middle">learn every path itself?</text><line x1="320" y1="44" x2="400" y2="44" stroke="#5b6b70" stroke-width="1.3" marker-end="url(#mdf)"/><text x="360" y="38" font-size="10" fill="#5b6b70" text-anchor="middle">yes</text><rect x="400" y="20" width="280" height="48" rx="5" fill="#f3f5f4" stroke="#8aa09a" stroke-width="1"/><text x="540.0" y="42.0" fill="#1d2a2f">ADD-PATH adds visibility only</text><text x="540.0" y="57.0" font-size="10" fill="#5b6b70">eBGP fabric: use multipath-relax</text><line x1="170" y1="68" x2="170" y2="104" stroke="#5b6b70" stroke-width="1.3" marker-end="url(#mdf)"/><text x="182" y="90" font-size="10" fill="#5b6b70" text-anchor="start">no</text><rect x="20" y="104" width="300" height="48" rx="24" fill="#ffffff" stroke="#1d2a2f"/><text x="170.0" y="124" font-size="11" fill="#1d2a2f" text-anchor="middle">Do the hidden paths have different</text><text x="170.0" y="140" font-size="11" fill="#1d2a2f" text-anchor="middle">next hops on different links?</text><line x1="320" y1="128" x2="400" y2="128" stroke="#5b6b70" stroke-width="1.3" marker-end="url(#mdf)"/><text x="360" y="122" font-size="10" fill="#5b6b70" text-anchor="middle">no</text><rect x="400" y="104" width="280" height="48" rx="5" fill="#f3f5f4" stroke="#8aa09a" stroke-width="1"/><text x="540.0" y="126.0" fill="#1d2a2f">ADD-PATH adds visibility only</text><text x="540.0" y="141.0" font-size="10" fill="#5b6b70">paths collapse onto one next hop</text><line x1="170" y1="152" x2="170" y2="188" stroke="#5b6b70" stroke-width="1.3" marker-end="url(#mdf)"/><text x="182" y="174" font-size="10" fill="#5b6b70" text-anchor="start">yes</text><rect x="20" y="188" width="300" height="48" rx="24" fill="#ffffff" stroke="#1d2a2f"/><text x="170.0" y="216" font-size="11" fill="#1d2a2f" text-anchor="middle">Do their AS paths differ?</text><line x1="320" y1="212" x2="400" y2="212" stroke="#5b6b70" stroke-width="1.3" marker-end="url(#mdf)"/><text x="360" y="206" font-size="10" fill="#5b6b70" text-anchor="middle">yes</text><rect x="400" y="188" width="280" height="48" rx="5" fill="#e7f1ed" stroke="#1f6a5a" stroke-width="1"/><text x="540.0" y="210.0" fill="#1d2a2f">ADD-PATH and multipath-relax</text><text x="540.0" y="225.0" font-size="10" fill="#5b6b70">neither works alone</text><line x1="170" y1="236" x2="170" y2="272" stroke="#5b6b70" stroke-width="1.3" marker-end="url(#mdf)"/><text x="182" y="258" font-size="10" fill="#5b6b70" text-anchor="start">no</text><rect x="20" y="272" width="300" height="48" rx="5" fill="#e7f1ed" stroke="#1f6a5a" stroke-width="1"/><text x="170.0" y="294.0" fill="#1d2a2f">ADD-PATH</text><text x="170.0" y="309.0" font-size="10" fill="#5b6b70">plus maximum-paths ibgp</text><text x="350" y="345" font-size="10.5" fill="#a83535" text-anchor="middle">For failover, add one question: is the backup reachable without going back through the router still sending you traffic?</text></g></svg>