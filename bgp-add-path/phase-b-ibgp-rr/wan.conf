hostname wan
log stdout informational
!
interface lo
 ip address 10.255.0.100/32
exit
interface eth1
 ip address 10.0.3.1/31
exit
interface eth2
 ip address 10.0.3.3/31
exit
interface eth9
 description server h2
 ip address 10.99.0.1/24
exit
!
router bgp 65100
 bgp router-id 10.255.0.100
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor 10.0.3.0 remote-as 65098
 neighbor 10.0.3.0 timers 3 9
 neighbor 10.0.3.0 advertisement-interval 0
 neighbor 10.0.3.2 remote-as 65099
 neighbor 10.0.3.2 timers 3 9
 neighbor 10.0.3.2 advertisement-interval 0
 !
 address-family ipv4 unicast
  maximum-paths 8
  maximum-paths ibgp 8
  neighbor 10.0.3.0 activate
  neighbor 10.0.3.2 activate
  network 10.99.0.0/24
 exit-address-family
exit
!
end
