hostname border2
log stdout informational
!
no ip nht resolve-via-default
!
interface lo
 ip address 10.255.0.22/32
 ip ospf area 0
exit
interface eth1
 ip address 10.0.1.3/31
 ip ospf area 0
 ip ospf network point-to-point
exit
interface eth2
 ip address 10.0.2.2/31
exit
!
router ospf
 ospf router-id 10.255.0.22
exit
!
router bgp 65000
 bgp router-id 10.255.0.22
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 timers 3 9
 neighbor 10.255.0.1 advertisement-interval 0
 neighbor 10.255.0.1 update-source lo
 neighbor 10.0.2.3 remote-as 65099
 neighbor 10.0.2.3 timers 3 9
 neighbor 10.0.2.3 advertisement-interval 0
 !
 address-family ipv4 unicast
  maximum-paths 8
  maximum-paths ibgp 8
  neighbor 10.255.0.1 activate
  neighbor 10.0.2.3 activate
  neighbor 10.255.0.1 next-hop-self
 exit-address-family
exit
!
end
