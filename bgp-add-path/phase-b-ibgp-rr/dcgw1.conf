hostname dcgw1
log stdout informational
!
interface lo
 ip address 10.255.0.98/32
exit
interface eth1
 ip address 10.0.2.1/31
exit
interface eth2
 ip address 10.0.3.0/31
exit
!
router bgp 65098
 bgp router-id 10.255.0.98
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.0.2.0 remote-as 65000
 neighbor 10.0.2.0 timers 3 9
 neighbor 10.0.2.0 advertisement-interval 0
 neighbor 10.0.3.1 remote-as 65100
 neighbor 10.0.3.1 timers 3 9
 neighbor 10.0.3.1 advertisement-interval 0
 !
 address-family ipv4 unicast
  maximum-paths 8
  maximum-paths ibgp 8
  neighbor 10.0.2.0 activate
  neighbor 10.0.3.1 activate
 exit-address-family
exit
!
end
