hostname rr1
log stdout informational
!
interface lo
 ip address 10.255.0.1/32
 ip ospf area 0
exit
interface eth1
 ip address 10.0.1.5/31
 ip ospf area 0
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 10.255.0.1
exit
!
router bgp 65000
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.255.0.11 remote-as 65000
 neighbor 10.255.0.11 timers 3 9
 neighbor 10.255.0.11 advertisement-interval 0
 neighbor 10.255.0.11 update-source lo
 neighbor 10.255.0.21 remote-as 65000
 neighbor 10.255.0.21 timers 3 9
 neighbor 10.255.0.21 advertisement-interval 0
 neighbor 10.255.0.21 update-source lo
 neighbor 10.255.0.22 remote-as 65000
 neighbor 10.255.0.22 timers 3 9
 neighbor 10.255.0.22 advertisement-interval 0
 neighbor 10.255.0.22 update-source lo
 !
 address-family ipv4 unicast
  maximum-paths 8
  maximum-paths ibgp 8
  neighbor 10.255.0.11 activate
  neighbor 10.255.0.11 route-reflector-client
  neighbor 10.255.0.21 activate
  neighbor 10.255.0.21 route-reflector-client
  neighbor 10.255.0.22 activate
  neighbor 10.255.0.22 route-reflector-client
 exit-address-family
exit
!
end
