hostname dcgw
log stdout informational
!
interface lo
 ip address 10.255.0.99/32
exit
interface eth1
 ip address 10.0.2.1/31
exit
interface eth2
 ip address 10.0.2.3/31
exit
interface eth9
 description server h2
 ip address 10.99.0.1/24
exit
!
router bgp 65099
 bgp router-id 10.255.0.99
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.0.2.0 remote-as 65000
 neighbor 10.0.2.0 timers 3 9
 neighbor 10.0.2.0 advertisement-interval 0
 neighbor 10.0.2.2 remote-as 65000
 neighbor 10.0.2.2 timers 3 9
 neighbor 10.0.2.2 advertisement-interval 0
 !
 address-family ipv4 unicast
  maximum-paths 8
  maximum-paths ibgp 8
  neighbor 10.0.2.0 activate
  neighbor 10.0.2.2 activate
  network 10.99.0.0/24
 exit-address-family
exit
!
end
